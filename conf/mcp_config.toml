[mcpServers.web_search]
desc = "联网查询"
command = "uv"
args = [
  "run",
  "mcps/servers/web_search/mcp_web_search.py",
  "--max-results", "10",
  "--firecrawl-url", "http://gpu2:9860/",
  "--searxng-url", "http://127.0.0.1:9863/"
]

[mcpServers.deep_research]
desc = "深度研究"
command = "uv"
args = [
  "run",
  "mcps/servers/web_search/mcp_web_search.py",
  "--deep-research",
  "--iteration-limit", "3",
  "--query-count", "3",
  "--max-results", "5",
  "--context-length", "2000",
  "--firecrawl-url", "http://gpu2:9860/",
  "--searxng-url", "http://127.0.0.1:9863/"
]

[mcpServers.mysql_mcp_server]
desc = "员工数据库问答"
url = "http://132.120.194.217:9500/sse"
system = """### 用户表的表结构的说明
#### staff - 员工表
CREATE TABLE `staff` (
  `id` int NOT NULL AUTO_INCREMENT,
  `name` varchar(45) NOT NULL COMMENT '姓名',
  `sex` varchar(45) DEFAULT NULL COMMENT '性别: 男,女',
  `team_id` int DEFAULT NULL COMMENT '所属团队id, 外键到team表',
  `job` varchar(45) DEFAULT '' COMMENT '职位',
  `mobile` varchar(45) NOT NULL COMMENT '手机号码',
  `email` varchar(45) NOT NULL COMMENT '邮箱',
  `note` varchar(500) DEFAULT '' COMMENT '备注',
  `ability` varchar(500) DEFAULT '' COMMENT '技能',
  `status` int DEFAULT '1' COMMENT '状态： 0: 已删除  1: 正常',
  PRIMARY KEY (`id`)
) ENGINE=InnoDB AUTO_INCREMENT=124 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci COMMENT='中国联通广东网络研发中心员工表';

#### team - 团队表的表结构说明
CREATE TABLE `team` (
  `id` int NOT NULL,
  `name` varchar(45) NOT NULL COMMENT '团队或者科室的名称\n',
  `manager` varchar(45) NOT NULL COMMENT '团队经理、团队负责人',
  `desc` varchar(45) DEFAULT '' COMMENT '团队职责描述',
  PRIMARY KEY (`id`)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
"""

[mcpServers.mcp-server-chart]
desc = "数据可视化插件"
command = "npx"
args = [
    "-y",
    "@antv/mcp-server-chart"
]
